<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PII Guard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{--bg:#f4f2ee;--panel:#fbfaf7;--panel2:#ebe8e1;--line:#d8d4ca;--tx:#16181d;--mu:#77756d;--ac:#1f4d3a;--ac2:#7a9a88;--ok:#2f6b4f;--wa:#a37a12;--hi:#c2561b;--cr:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101211;--panel:#161918;--panel2:#1d211f;--line:#2b302d;--tx:#ecebe6;--mu:#8b8f89;--ac:#9fd8b8;--ac2:#4f7a65;--ok:#7cc4a0;--wa:#d9b24a;--hi:#e08a55;--cr:#e57a70}}
:root[data-theme="dark"]{--bg:#101211;--panel:#161918;--panel2:#1d211f;--line:#2b302d;--tx:#ecebe6;--mu:#8b8f89;--ac:#9fd8b8;--ac2:#4f7a65;--ok:#7cc4a0;--wa:#d9b24a;--hi:#e08a55;--cr:#e57a70}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13.5px/1.5 Inter,system-ui,sans-serif;display:flex;-webkit-font-smoothing:antialiased}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
aside{width:212px;border-right:1px solid var(--line);padding:26px 0 20px 26px;display:flex;flex-direction:column;overflow:auto;flex:none}
.logo{display:flex;gap:11px;align-items:center;margin-bottom:34px;font-family:Newsreader,Georgia,serif;font-size:21px;letter-spacing:-.01em}
.logo i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tx);background:radial-gradient(circle,var(--ac) 0 3.5px,transparent 4px)}
.logo small{display:block;font:500 9.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:1px}
nav a{display:flex;gap:12px;padding:7px 0;color:var(--mu);cursor:pointer;border-right:2px solid transparent;margin-right:-1px}
nav a span{font:400 10.5px "JetBrains Mono",monospace;padding-top:3px;opacity:.7}
nav a:hover{color:var(--tx)}nav a.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{flex:1;min-width:0;overflow:auto;padding:30px 44px 60px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:34px;padding-bottom:18px;border-bottom:1px solid var(--tx)}
h1{font:400 34px/1.1 Newsreader,Georgia,serif;margin:0;letter-spacing:-.02em}.sub{color:var(--mu);margin-top:6px}
.btn{background:var(--tx);color:var(--bg);border:1px solid var(--tx);border-radius:2px;padding:7px 14px;cursor:pointer;font:500 12.5px Inter,sans-serif}
.btn.g{background:transparent;color:var(--tx);border-color:var(--line)}.btn.g:hover{border-color:var(--tx)}
.grid{display:grid;gap:36px 40px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:none;border:0;border-top:1px solid var(--line);padding:14px 0 0;min-width:0}
.card h3{margin:0 0 16px;font:600 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.kpi{border-top-color:var(--tx)}.kpi .l{color:var(--mu);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.kpi .v{font:400 44px/1.1 Newsreader,Georgia,serif;letter-spacing:-.03em;margin:8px 0 4px}.kpi .d{font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;color:var(--mu);font:500 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px 10px 0;border-bottom:1px solid var(--line)}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel2)}tr:last-child td{border:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c,var(--tx));background:none}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--tx))}
.Critical{--c:var(--cr)}.High{--c:var(--hi)}.Medium{--c:var(--wa)}.Low,.Protected,.Healthy,.Active,.Completed{--c:var(--ok)}.Pending,.Scanning,.Degraded,.Partial{--c:var(--wa)}.Inactive,.Unscanned{--c:var(--mu)}.Unprotected{--c:var(--cr)}
.bar{height:2px;background:var(--line);margin-top:6px}.bar b{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.mu{color:var(--mu)}.mono{font:400 12px "JetBrains Mono",monospace}
input,select{background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 2px;font:inherit;outline:0}input:focus,select:focus{border-color:var(--tx)}
.chips{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line)}.chip{padding:0 0 9px;color:var(--mu);cursor:pointer;margin-bottom:-1px;border-bottom:2px solid transparent}.chip:hover{color:var(--tx)}.chip.on{color:var(--tx);border-color:var(--ac);font-weight:600}
.pre{background:var(--panel2);padding:18px;white-space:pre-wrap;word-break:break-word;line-height:2;border-radius:2px}
mark{background:none;color:var(--cr);border-bottom:1.5px solid var(--cr);padding:0}mark.m{color:var(--ok);border-color:var(--ok)}
.sw{width:30px;height:16px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0}.sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--bg);transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:16px}
.flow{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}.flow>div{flex:1;min-width:170px}.flow .ar{flex:none;min-width:0;align-self:center;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.logo{display:none}nav{display:flex;gap:16px}nav a{white-space:nowrap;border:0}main{padding:20px 18px}h1{font-size:26px}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--tx)}
.step{padding:12px 12px 4px 0;opacity:.45}.step.on,.step.done{opacity:1}.step b{display:block;font-weight:600}.step small{color:var(--mu)}.step.out{border-left:1px dashed var(--cr);padding-left:14px}
.zone{display:flex;gap:0;font:600 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}.zone span:first-child{flex:4}.zone span:last-child{flex:2;color:var(--cr);padding-left:14px}
.tb{padding:12px 14px;border-left:2px solid var(--ok);background:var(--panel2);margin:18px 0 0}.tb.bad{border-color:var(--cr)}
.chat{height:340px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.msg{margin:12px 0;max-width:92%}.msg.u{margin-left:auto;background:var(--panel2);padding:10px 14px;border-radius:2px}.msg small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
textarea{width:100%;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:2px;padding:12px;font:inherit;resize:none;outline:0;margin-top:12px}textarea:focus{border-color:var(--tx)}
#login{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#login[hidden]{display:none}
#login form{width:340px;max-width:100%}#login h1{font-size:30px;margin-bottom:6px}#login .sub{margin-bottom:28px}
#login label{display:block;font:500 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}#login input{width:100%;margin:4px 0 20px}
#login .err{color:var(--cr);min-height:20px;margin-bottom:10px}#login .btn{width:100%;padding:10px 14px}#login .btn:disabled{opacity:.6;cursor:default}
</style></head><body>
<div id="login" hidden><form onsubmit="doLogin(event)" autocomplete="on"><h1>PII Guard</h1><div class="sub">Sign in to continue. Demo accounts are listed in the README.</div>
<label for="lu">Username</label><input id="lu" name="username" autocomplete="username" required maxlength="64">
<label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required maxlength="128">
<div class="err" id="lerr" role="alert"></div><button class="btn" id="lb" type="submit">Sign in</button></form></div>
<aside><div class="logo"><i></i><div>PII Guard<small>Object Storage</small></div></div><nav id="nav"></nav></aside>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s);
const PAGES=[['dash','◉','Dashboard'],['store','▤','Object Storage'],['detect','⌕','PII Detection'],['obj','▣','Object Details'],['policy','⚙','Policy Engine'],['anon','⇄','Anonymization'],['ana','◔','Analytics'],['audit','☰','Audit Logs'],['health','♥','System Health'],['sec','⛨','Security Overview'],['llm','✦','LLM Playground']];
const TYPES=[['Name',4210,96],['Email',3120,99],['Phone',2480,94],['Address',1730,88],['Credit Card',910,98],['IP Address',1260,97],['SSN / Aadhaar',640,95],['Username',820,85]];
const COL=['#1f4d3a','#4f7a65','#8fae9c','#c9a24a','#b3261e','#5b6b7a','#a9a597','#33383a'];
const OBJ=[
['customers_export.csv','prod-customer-data','csv','48.2 MB','Completed',312,'Critical','Protected'],
['support_tickets_q3.json','support-archive','json','12.7 MB','Completed',148,'High','Protected'],
['kyc_scans_batch7.pdf','kyc-documents','pdf','230 MB','Scanning',0,'Medium','Pending'],
['payments_ledger.parquet','finance-raw','parquet','91.4 MB','Completed',527,'Critical','Partial'],
['web_access_logs.log','ops-logs','log','1.2 GB','Completed',89,'Medium','Protected'],
['hr_onboarding.docx','hr-confidential','docx','3.4 MB','Completed',64,'High','Unprotected'],
['product_catalog.json','public-assets','json','6.1 MB','Completed',0,'Low','Protected'],
['chat_transcripts.txt','support-archive','txt','27.9 MB','Completed',203,'High','Protected'],
['ml_training_set.csv','ai-datasets','csv','780 MB','Unscanned',0,'Medium','Pending']];
const LOG=[['09:42:11','svc-ingest','Upload','customers_export.csv','OK'],['09:42:19','pii-engine','PII Detection','312 entities found','Critical'],['09:42:20','policy-engine','Policy Applied','Email → Mask','OK'],['09:41:02','a.krishnan','Download','support_tickets_q3.json','Anonymized'],['09:38:47','anonymizer','Anonymization','payments_ledger.parquet','Partial'],['09:30:15','m.fernandes','Policy Change','Username → Hash (disabled)','Warn'],['09:22:08','ml-pipeline','Download','ml_training_set.csv','Denied'],['09:12:55','svc-ingest','Upload','hr_onboarding.docx','OK'],['09:12:58','pii-engine','PII Detection','64 entities found','High']];
const SVC=[['Object Storage (S3 / X10000)','99.99%','12 ms'],['PII Detection Engine','99.94%','184 ms'],['Policy Engine','100%','6 ms'],['Anonymization Service','99.71%','241 ms'],['PostgreSQL Database','99.98%','4 ms'],['Proxy API Gateway','99.96%','21 ms'],['Kafka Event Bus','98.90%','—']];
let page=location.hash.slice(1)||'dash',sel=0,bk='All',q='',lf='All';
const pill=t=>`<span class="pill ${t.split(' ')[0]}">${t}</span>`;
const bar=(p,c)=>`<div class="bar"><b style="width:${p}%;${c?'background:'+c:''}"></b></div>`;
const kpi=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
function donut(data,cols){const t=data.reduce((a,b)=>a+b[1],0);let o=25,s='';data.forEach((d,i)=>{const p=d[1]/t*100;s+=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${cols[i]}" stroke-width="4" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"/>`;o-=p});
return `<div class="row" style="gap:18px;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="150">${s}</svg><div style="flex:1;min-width:140px">${data.map((d,i)=>`<div class="row" style="margin:5px 0"><span><span class="dot" style="--c:${cols[i]}"></span> ${d[0]}</span><b>${d[1].toLocaleString()}</b></div>`).join('')}</div></div>`}
function line(a,b,c){const w=420,h=150,mx=Math.max(...a,...(b||[]))*1.1;const pt=v=>v.map((y,i)=>`${i*w/(v.length-1)},${h-y/mx*h}`).join(' ');
return `<svg viewBox="0 0 ${w} ${h+4}" width="100%" preserveAspectRatio="none" style="height:170px"><polyline points="0,${h} ${pt(a)} ${w},${h}" fill="${c||'var(--ac)'}" opacity=".08"/><polyline points="${pt(a)}" fill="none" stroke="${c||'var(--ac)'}" stroke-width="1.5"/>${b?`<polyline points="${pt(b)}" fill="none" stroke="var(--cr)" stroke-width="1.5"/>`:''}</svg>`}
function hbars(rows){return rows.map(r=>`<div style="margin:11px 0"><div class="row"><span>${r[0]}</span><b>${r[1]}${r[2]||''}</b></div>${bar(r[3]??r[1])}</div>`).join('')}
const head=(t,s,x='')=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="row">${x}<span class="mu">${esc(AUTH.user||'')} · ${esc(AUTH.role||'')}</span><button class="btn g" onclick="tg()">Theme</button><button class="btn g" onclick="logout()">Sign out</button></div></div>`;
function tg(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#101211';r.dataset.theme=d?'light':'dark'}
function logTbl(rows){return `<div class="tw"><table><tr><th>Time</th><th>User</th><th>Event</th><th>Detail</th><th>Result</th></tr>${rows.map(r=>`<tr><td class="mono mu">${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td><td>${r[3]}</td><td>${pill(r[4]=='OK'?'Completed':r[4]=='Denied'||r[4]=='Warn'?'Unprotected':r[4]=='Critical'||r[4]=='High'?r[4]:r[4]=='Partial'?'Partial':'Protected').replace(/>[^<]+</,'>'+r[4]+'<')}</td></tr>`).join('')}</table></div>`}
const V={
dash(){return dashView()},
store(){const bs=['All',...new Set(OBJ.map(o=>o[1]))];const rows=OBJ.map((o,i)=>[o,i]).filter(([o])=>(bk=='All'||o[1]==bk)&&o[0].includes(q));
return head('Object Storage','Buckets and objects with live scan status',`<button class="btn" onclick="alert('Upload goes through the S3 proxy; scanning starts on PUT event.')">Upload</button>`)+`
<div class="chips">${bs.map(b=>`<span class="chip ${b==bk?'on':''}" onclick="bk='${b}';go()">${b}</span>`).join('')}</div>
<div class="card"><div class="row" style="margin-bottom:12px"><input id="q" placeholder="Search objects…" value="${q}" style="width:280px;max-width:100%" oninput="q=this.value;go(1)"><span class="mu">${rows.length} objects</span></div>
<div class="tw"><table><tr><th>Name</th><th>Bucket</th><th>Size</th><th>Scan</th><th>PII</th><th>Risk</th><th>Protection</th></tr>${rows.map(([o,i])=>`<tr class="cl" onclick="sel=${i};nav('obj')"><td><b>${o[0]}</b></td><td class="mu">${o[1]}</td><td>${o[3]}</td><td>${pill(o[4])}</td><td>${o[5]}</td><td>${pill(o[6])}</td><td>${pill(o[7])}</td></tr>`).join('')}</table></div></div>`},
detect(){return head('PII Detection','Entity types, confidence and latest results')+`
<div class="grid g4">${TYPES.map((t,i)=>`<div class="card"><div class="row"><b>${t[0]}</b><span class="dot" style="--c:${COL[i]};box-shadow:none"></span></div><div class="v" style="font-size:24px;font-weight:700;margin:6px 0">${t[1].toLocaleString()}</div><div class="row mu" style="font-size:12px"><span>Avg confidence</span><b style="color:var(--tx)">${t[2]}%</b></div>${bar(t[2],COL[i])}</div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h3>Latest detection results</h3><div class="tw"><table><tr><th>Object</th><th>Entity</th><th>Value (masked view)</th><th>Confidence</th><th>Detector</th></tr>
${[['customers_export.csv','Email','pr•••••@acme.in',99],['customers_export.csv','Credit Card','4532 •••• •••• 7714',98],['support_tickets_q3.json','Phone','+91 98••• ••210',94],['hr_onboarding.docx','Address','12, MG Road, Be•••••',87],['web_access_logs.log','IP Address','10.24.•.••',97],['chat_transcripts.txt','Name','Pr••• Ra•••',96]].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="mono">${r[2]}</td><td style="width:170px"><div class="row">${bar(r[3])}<b>${r[3]}%</b></div></td><td class="mu">${r[1]=='Name'||r[1]=='Address'?'NER model':'Regex + checksum'}</td></tr>`).join('')}</table></div></div>`},
obj(){const o=OBJ[sel];const sp=[['Priya Raman','Name','Pseudonymize','Anita Verma'],['priya.raman@acme.in','Email','Mask','p•••••••••@acme.in'],['+91 98765 43210','Phone','Mask','+91 •••••• ••210'],['4532 8891 0023 7714','Credit Card','Redact','[REDACTED]'],['10.24.8.17','IP Address','Hash','a91f3c7e']];
const T=[['Customer: ',0],[sp[0]],['\nEmail: '],[sp[1]],['\nPhone: '],[sp[2]],['\nCard: '],[sp[3]],['\nLast login from: '],[sp[4]]];
const orig=T.map(t=>t[1]==undefined&&t.length==4?`<mark>${t[0]}</mark>`:t[0].length>4&&typeof t[0]=='string'&&t.length==1?t[0]:t[0]).join('');
const render=m=>T.map(t=>t.length==4?`<mark class="${m?'m':''}">${m?t[3]:t[0]}</mark>`:t[0]).join('');
return head(o[0],`${o[1]} · ${o[3]} · ${o[2].toUpperCase()}`,pill(o[7]))+`
<div class="chips">${OBJ.map((x,i)=>`<span class="chip ${i==sel?'on':''}" onclick="sel=${i};go()">${x[0]}</span>`).join('')}</div>
<div class="grid g3"><div class="card"><h3>Metadata</h3>${[['Bucket',o[1]],['Size',o[3]],['Type',o[2]],['Last scanned','Today 09:42'],['ETag','9b2f…e41a'],['Scan status',o[4]],['Risk',o[6]],['PII entities',o[5]]].map(r=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="mu">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
<div class="card" style="grid-column:span 2"><h3>Detected PII</h3><div class="tw"><table><tr><th>Value</th><th>Type</th><th>Policy</th></tr>${sp.map(s=>`<tr><td class="mono">${s[0]}</td><td>${s[1]}</td><td>${pill('Active').replace('Active',s[2])}</td></tr>`).join('')}</table></div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Original content <span class="pill Critical">Restricted</span></h3><div class="pre mono">${render(0)}</div></div><div class="card"><h3>Anonymized preview <span class="pill Protected">Served on GET</span></h3><div class="pre mono">${render(1)}</div></div></div>`},
anon(){const s=[['Priya Raman','Name','Pseudonymize','Anita Verma'],['priya.raman@acme.in','Email','Mask','p•••••••••@acme.in'],['4532 8891 0023 7714','Credit Card','Redact','[REDACTED]'],['10.24.8.17','IP Address','Hash','a91f3c7e']];
return head('Anonymization','Original → detected PII → policy → protected output')+s.map(r=>`<div class="card" style="margin-bottom:12px"><div class="flow"><div><div class="mu" style="font-size:11px">ORIGINAL</div><div class="mono"><mark>${r[0]}</mark></div></div><span class="ar">→</span><div><div class="mu" style="font-size:11px">DETECTED</div>${pill('High').replace('High',r[1])}</div><span class="ar">→</span><div><div class="mu" style="font-size:11px">POLICY</div>${pill('Active').replace('Active',r[2])}</div><span class="ar">→</span><div><div class="mu" style="font-size:11px">PROTECTED OUTPUT</div><div class="mono"><mark class="m">${r[3]}</mark></div></div></div></div>`).join('')+`<div class="grid g3"><div class="card kpi"><div class="l">Avg latency / GET</div><div class="v">241 ms</div><div class="d">~45 entities per object</div></div>${kpi('Anonymized today','8,412','+12%')}${kpi('Failures','3','0.04%')}</div>`},
ana(){return head('Analytics','Trends, distribution and coverage')+`<div class="grid g2"><div class="card"><h3>PII distribution</h3>${donut(TYPES.map(t=>[t[0],t[1]]),COL)}</div>
<div class="card"><h3>Detection vs protection · 14 days</h3>${line([30,42,38,55,48,62,58,71,66,80,74,92,85,98],[26,38,36,52,47,60,57,70,65,79,74,90,84,97])}<div class="row mu" style="font-size:12px"><span>● Detected</span><span style="color:var(--cr)">● Protected</span></div></div>
<div class="card"><h3>Risk distribution</h3>${hbars([['Critical',412,'',3],['High',1860,'',12],['Medium',5230,'',34],['Low',7668,'',51]])}</div>

/* ---------- LLM Playground: Ollama llama3.2 via /api/llm/chat (PII is detected + protected server-side) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LLM={cfg:{endpoint:'/api/llm/chat'}, // recommended: your proxy-server forwards to the provider so API keys stay server-side
providers:{
 ollama:{label:'Ollama (local)',enabled:true,models:['llama3.2'],async chat({model,messages}){ // server detects + protects; raw text never reaches Ollama
  const r=await api(LLM.cfg.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:'ollama',model,messages})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));
  return{content:j.message.content,guard:j.pii_guard}}}}};
const seg=(t,items,f)=>{let p=0,s='';items.forEach(i=>{s+=esc(t.slice(p,i.s))+f(i);p=i.e});return s+esc(t.slice(p))};
const L={model:'llama3.2',msgs:[],sent:[],run:null,busy:0,draft:''};
const SAMPLES=["Draft a reply to Priya Raman (priya.raman@acme.in, +91 98765 43210) about the failed payment on card 4532 8891 0023 7714.","Customer Daniel Costa at 42 Residency Road reported a login from 10.24.8.17. Summarise the incident."];
async function runPipeline(text){
 const res=await LLM.providers.ollama.chat({model:L.model,messages:[...L.sent,{role:'user',content:text}]}),g=res.guard;
  L.sent.push({role:'user',content:g.protected_prompt},{role:'assistant',content:res.content});
  const items=g.entities.map(e=>({s:e.start,e:e.end,v:e.value,t:e.entity_type,c:Math.round(e.score*100),act:e.operator_name,src:e.policy_source,out:Object.entries(e.operator_params).map(([k,v])=>k+'='+v).join(', ')||'(none)'}));
  return{text,prot:g.protected_prompt,items,payload:g.ollama_request,response:res.content,model:g.model_used,server:g}}
async function send(){const t=L.draft.trim();if(!t||L.busy)return;L.busy=1;L.msgs.push({role:'user',text:t});L.draft='';rl();
 try{const r=await runPipeline(t);L.run=r;L.msgs.push({role:'assistant',text:r.response})}catch(e){L.msgs.push({role:'assistant',text:'Error: '+e.message})}L.busy=0;rl()}
function rl(){go();const c=$('.chat');if(c)c.scrollTop=1e9;const t=$('#pr');if(t&&!L.busy)t.focus()}
V.llm=()=>{const r=L.run,ap=r&&r.server?[...new Map(r.items.filter(i=>i.act!='None').map(i=>[i.t,i])).values()]:[];
const active=L.busy?(L.msgs.length?3:0):-1;
const st=[['User prompt','Raw input'],['PII detection',r?r.items.length+' entities':'Presidio (server)'],['Mask / anonymize','Policy engine'],['Protected prompt','Safe to send'],['LLM',L.model],['Response','Returned']];

${r&&r.server&&r.server.policy_mode=='passthrough'?`<div class="tb"><b>No masking rules apply to your account, so your prompt is sent unchanged.</b> <span class="mu">An administrator can assign a policy in the Policy Engine.</span></div>`:`<div class="tb"><b>Only the protected prompt is sent to the LLM.</b> <span class="mu">Original text never leaves your environment.</span></div>`}

<div class="chat">${L.msgs.length?L.msgs.map(m=>`<div class="msg ${m.role=='user'?'u':''}"><small>${m.role=='user'?'You · protected before sending':L.model}</small>${esc(m.text)}</div>`).join(''):`<div class="mu" style="padding:20px 0">Enter a prompt containing personal data, or try a sample:</div>`}${L.busy?'<div class="msg mu">Processing…</div>':''}</div>
<div class="chips" style="margin:12px 0 0;border:0;gap:14px">${SAMPLES.map((s,i)=>`<span class="chip" style="border:0;padding:0;text-decoration:underline" onclick="L.draft=SAMPLES[${i}];rl()">Sample ${i+1}</span>`).join('')}<span class="chip" style="border:0;padding:0" onclick="L.msgs=[];L.sent=[];L.run=null;rl()">Clear</span></div>
<textarea id="pr" rows="3" placeholder="Type a prompt… (Enter to send, Shift+Enter for new line)" oninput="L.draft=this.value" onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();send()}">${esc(L.draft)}</textarea>

<div class="card" style="margin-top:30px"><h3>Detected PII <span>${r.items.length} entities</span></h3>${r.items.length?`<div class="tw"><table><tr><th>Value</th><th>Type</th><th>Confidence</th><th>Policy</th><th>${r.server?'Operator params':'Protected output'}</th></tr>${r.items.map(i=>`<tr><td class="mono">${esc(i.v)}</td><td><b>${i.t}</b></td><td style="width:160px"><div class="row"><b>${i.c}%</b></div>${bar(i.c)}</td><td>${i.act=='None'?pill('Unprotected').replace('Unprotected','No policy'):pill('Active').replace('Active',i.act)}</td><td class="mono">${esc(i.out)}</td></tr>`).join('')}</table></div>`:'<div class="mu">No PII detected in this prompt.</div>'}</div>
${r.server?`<div class="card" style="margin-top:30px"><h3>Applied policy <span>user: ${esc(r.server.policy_user)}${r.server.policy_mode=='passthrough'?' · no masking rules apply → sent unchanged':r.server.policy_found?'':' · no policy found → default replace'}</span></h3>${ap.length?`<div class="tw"><table><tr><th>Entity type</th><th>Operator</th><th>Parameters</th><th>Source</th></tr>${ap.map(i=>`<tr><td><b>${i.t}</b></td><td>${pill('Active').replace('Active',i.act)}</td><td class="mono">${esc(i.out)}</td><td class="mu">${esc(i.src)}</td></tr>`).join('')}</table></div>`:`<div class="mu">${r.server.policy_mode=='passthrough'?'No masking rules apply to this account, so the prompt was sent unchanged.':'No PII detected, so no policy was applied.'}</div>`}</div>`:''}
<div class="grid g2" style="margin-top:30px"><div class="card"><h3>Original prompt <span class="pill Critical">Stays here</span></h3><div class="pre mono">${seg(r.text,r.items,i=>`<mark>${esc(i.v)}</mark>`)}</div></div>
<div class="card"><h3>Protected prompt <span class="pill Protected">Sent to LLM</span></h3><div class="pre mono">${esc(r.prot)}</div></div></div>

/* ---------- Policy Engine: /api/policies and /api/users (admin only; enforced by the server) ---------- */
const PE={loaded:0,loading:0,policies:[],users:[],ed:null,err:'',ok:''};
const OPS=['mask','redact','replace','hash'],ENT=['PERSON','EMAIL_ADDRESS','PHONE_NUMBER','CREDIT_CARD','US_SSN','US_BANK_NUMBER','IP_ADDRESS','LOCATION','DATE_TIME','URL','IBAN_CODE','US_DRIVER_LICENSE','US_PASSPORT','MEDICAL_LICENSE','CRYPTO','NRP'];
const qa=s=>esc(s).replace(/"/g,'&quot;');
const errMsg=async r=>{const j=await r.json().catch(()=>({})),d=j.detail;return Array.isArray(d)?d.map(x=>String(x.msg).replace(/^Value error, /,'')).join(' · '):(d||'HTTP '+r.status)};
const defParams=o=>o=='mask'?{chars_to_mask:'10',masking_char:'*',from_end:false}:o=='replace'?{new_value:''}:o=='hash'?{hash_type:'sha256'}:{};
async function peLoad(){PE.loading=1;
 try{const[a,b]=await Promise.all([api('/api/policies'),api('/api/users')]);if(a.status==401||b.status==401){PE.loading=0;return}
  if(!a.ok)throw new Error(await errMsg(a));if(!b.ok)throw new Error(await errMsg(b));PE.policies=await a.json();PE.users=await b.json();PE.err=''}
 catch(e){PE.err='Could not load policies: '+e.message}
 PE.loaded=1;PE.loading=0;go()}
async function peCall(method,url,body,okMsg){PE.err=PE.ok='';
 try{const r=await api(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status==401)return false;
  if(!r.ok){PE.err=await errMsg(r);go();return false}PE.ok=okMsg;await peLoad();return true}
 catch(e){PE.err='Request failed: '+e.message;go();return false}}
function peNew(){PE.err=PE.ok='';PE.ed={isNew:true,name:'',rules:[{entity_type:'PERSON',operator_name:'replace',operator_params:defParams('replace')}]};go()}
function peEdit(i){const p=PE.policies[i];PE.err=PE.ok='';PE.ed={isNew:false,name:p.policy_name,rules:JSON.parse(JSON.stringify(p.rules))};go()}
function peCancel(){PE.ed=null;PE.err='';go()}
function peAddRule(){const used=PE.ed.rules.map(r=>r.entity_type);PE.ed.rules.push({entity_type:ENT.find(e=>!used.includes(e))||'',operator_name:'mask',operator_params:defParams('mask')});go()}
function peDelRule(i){PE.ed.rules.splice(i,1);go()}
function peSetEnt(i,v){PE.ed.rules[i].entity_type=v.trim().toUpperCase()}
function peSetOp(i,v){PE.ed.rules[i].operator_name=v;PE.ed.rules[i].operator_params=defParams(v);go()}
function peParam(i,k,v){PE.ed.rules[i].operator_params[k]=v}
function peSave(){const e=PE.ed,rules=e.rules.map(r=>{const p=r.operator_params,o=r.operator_name;let q={};
  if(o=='mask')q={chars_to_mask:parseInt(p.chars_to_mask,10),masking_char:p.masking_char||'*',from_end:!!p.from_end};
  else if(o=='replace'){if(p.new_value)q={new_value:p.new_value}}else if(o=='hash')q={hash_type:p.hash_type||'sha256'};
  return{entity_type:r.entity_type,operator_name:o,operator_params:q}});
 (e.isNew?peCall('POST','/api/policies',{policy_name:e.name.trim(),rules},'Policy created.'):peCall('PUT','/api/policies/'+encodeURIComponent(e.name),{rules},'Policy updated. It applies to the next request.')).then(ok=>{if(ok)PE.ed=null;go()})}
function peDelete(i){const n=PE.policies[i].policy_name;if(confirm('Delete policy '+n+'?'))peCall('DELETE','/api/policies/'+encodeURIComponent(n),null,'Policy deleted.')}
function peAssign(i,v){const u=PE.users[i].user_name;peCall('PUT','/api/users/'+encodeURIComponent(u)+'/policy',{policy_name:v||null},'Assigned '+(v||'no policy')+' to '+u+'. It applies to their next request.')}
function peParams(r,i){const p=r.operator_params,o=r.operator_name;
 if(o=='mask')return`<input type="number" min="0" style="width:64px" value="${qa(p.chars_to_mask)}" oninput="peParam(${i},'chars_to_mask',this.value)"> chars with <input maxlength="1" style="width:28px;text-align:center" value="${qa(p.masking_char)}" oninput="peParam(${i},'masking_char',this.value)"> <label class="mu"><input type="checkbox" style="width:auto" ${p.from_end?'checked':''} onchange="peParam(${i},'from_end',this.checked)"> from end</label>`;
 if(o=='replace')return`<input placeholder="&lt;ENTITY&gt; (default)" style="width:180px" value="${qa(p.new_value||'')}" oninput="peParam(${i},'new_value',this.value)">`;
 if(o=='hash')return`<select onchange="peParam(${i},'hash_type',this.value)">${['sha256','sha512'].map(h=>`<option ${p.hash_type==h?'selected':''}>${h}</option>`).join('')}</select>`;
 return'<span class="mu">removes the text</span>'}
V.policy=()=>{const adm=AUTH.role=='admin',hd=head('Policy Engine','Rules per PII type, enforced inline on GET and in the LLM Playground',adm?`<button class="btn g" onclick="PE.loaded=0;go()">Refresh</button><button class="btn" onclick="peNew()">+ New policy</button>`:'');
 if(!adm)return hd+`<div class="card"><div class="mu">Only administrators can view or change policies.</div></div>`;
 if(!PE.loaded&&!PE.loading)peLoad();
 const msg=(PE.err?`<div class="tb bad"><b>${esc(PE.err)}</b></div>`:'')+(PE.ok?`<div class="tb"><b>${esc(PE.ok)}</b></div>`:''),e=PE.ed;
 const editor=e?`<div class="card" style="margin-top:24px"><h3>${e.isNew?'New policy':'Edit policy'}</h3>
<div class="row" style="justify-content:flex-start;margin-bottom:14px"><span class="mu">Name</span><input placeholder="e.g. analyst_policy" maxlength="64" style="width:260px" value="${qa(e.name)}" ${e.isNew?'':'disabled'} oninput="PE.ed.name=this.value"></div>
<div class="tw"><table><tr><th>PII type</th><th>Action</th><th>Parameters</th><th></th></tr>${e.rules.map((r,i)=>`<tr><td><input list="ents" style="width:190px" value="${qa(r.entity_type)}" oninput="peSetEnt(${i},this.value)"></td><td><select onchange="peSetOp(${i},this.value)">${OPS.map(o=>`<option ${o==r.operator_name?'selected':''}>${o}</option>`).join('')}</select></td><td>${peParams(r,i)}</td><td><button class="btn g" onclick="peDelRule(${i})" title="Remove rule">✕</button></td></tr>`).join('')}</table></div>
<datalist id="ents">${ENT.map(x=>`<option value="${x}">`).join('')}</datalist>
<div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn g" onclick="peAddRule()">+ Add rule</button><button class="btn" onclick="peSave()">Save</button><button class="btn g" onclick="peCancel()">Cancel</button></div></div>`:'';
 const rows=PE.policies.map((p,i)=>`<tr><td><b>${esc(p.policy_name)}</b></td><td class="mono">${p.rules.map(x=>esc(x.entity_type)+' <span class="mu">'+esc(x.operator_name)+'</span>').join('<br>')}</td><td>${p.assigned_users.length?p.assigned_users.map(esc).join(', '):'<span class="mu">nobody</span>'}</td><td style="white-space:nowrap"><button class="btn g" onclick="peEdit(${i})">Edit</button> <button class="btn g" onclick="peDelete(${i})">Delete</button></td></tr>`).join('');
 const urows=PE.users.map((u,i)=>`<tr><td><b>${esc(u.user_name)}</b></td><td class="mu">${esc(u.role)}</td><td><select onchange="peAssign(${i},this.value)"><option value="" ${u.policy_name?'':'selected'}>(no policy: original file)</option>${PE.policies.map(p=>`<option ${p.policy_name==u.policy_name?'selected':''}>${esc(p.policy_name)}</option>`).join('')}</select></td></tr>`).join('');
 return hd+msg+`<div class="card" style="margin-top:24px"><h3>Policies <span>${PE.policies.length}</span></h3>${PE.loading&&!PE.loaded?'<div class="mu">Loading…</div>':`<div class="tw"><table><tr><th>Name</th><th>Rules</th><th>Assigned to</th><th></th></tr>${rows||'<tr><td colspan="4" class="mu">No policies yet.</td></tr>'}</table></div>`}</div>${editor}
<div class="card" style="margin-top:24px"><h3>User assignments</h3><div class="tw"><table><tr><th>User</th><th>Role</th><th>Policy</th></tr>${urows||'<tr><td colspan="3" class="mu">No users.</td></tr>'}</table></div></div>
<div class="grid g4" style="margin-top:24px">${[['mask','Hide N characters, keep the rest'],['redact','Remove the text entirely'],['replace','Substitute a fixed value'],['hash','SHA-256 / SHA-512 digest']].map(a=>`<div class="card"><b>${a[0]}</b><div class="mu" style="margin-top:4px">${a[1]}</div></div>`).join('')}</div>`};

const DB_EPS=['summary','pii-types','detection','anonymization','llm-prompts','activity'];
const D={r:{},loading:0,at:null,timer:null};
const fmtN=n=>Number(n||0).toLocaleString(),pct=v=>v==null?'—':v+'%';
const fmtB=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const fmtT=iso=>{const d=new Date(iso),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});return d.toDateString()==new Date().toDateString()?t:d.toLocaleDateString([],{day:'2-digit',month:'short'})+' '+t};
const nice=t=>esc(String(t).replace(/_/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\b(Ip|Us|Uk|Ssn|Url|Iban|Nrp|Nhs|Itin|Pan|Gst|Upi)\b/g,w=>w.toUpperCase()));
async function dbLoad(){if(D.loading)return;D.loading=1;if(page=='dash')dbPaint();
 const tz=-new Date().getTimezoneOffset(),q={summary:'',detection:'?tz_offset_minutes='+tz,anonymization:'?tz_offset_minutes='+tz,'llm-prompts':'?tz_offset_minutes='+tz,activity:'?limit=8','pii-types':''};
 const res=await Promise.all(DB_EPS.map(async ep=>{try{const r=await api('/api/dashboard/'+ep+q[ep]);if(r.status==401)return null;
  if(!r.ok)return{err:await errMsg(r)};const j=await r.json();return{data:j.data,at:j.generated_at}}catch(e){return{err:'Cannot reach the server ('+e.message+')'}}}));
 D.loading=0;if(!AUTH.token)return;DB_EPS.forEach((ep,i)=>{if(res[i])D.r[ep]=res[i]});D.at=new Date();if(page=='dash')dbPaint()}
function dbPaint(){const m=$('#m'),st=m?m.scrollTop:0;go();if(m)m.scrollTop=st}
function dbAuto(){clearInterval(D.timer);D.timer=setInterval(()=>{if(page=='dash'&&AUTH.token&&!document.hidden)dbLoad()},30000)}
const dbMsg=(t,cls='mu')=>`<div class="${cls}" style="padding:10px 0">${t}</div>`;
function dbSec(ep,fn){const x=D.r[ep];if(!x)return dbMsg('Loading…');if(x.err)return dbMsg('Unavailable: '+esc(x.err),'mu');return fn(x.data)}
function actTbl(items){const ev={upload:'Upload',detection:'PII Detection',anonymization:'Anonymization',download:'Download',delete:'Delete'};
 const res={ok:['Completed','OK'],failed:['Unprotected','Failed'],original:['Pending','Original']};
 return `<div class="tw"><table><tr><th>Time</th><th>User</th><th>Event</th><th>Detail</th><th>Result</th></tr>${items.map(i=>{const r=res[i.status]||['Inactive',i.status];
  const where=i.source=='llm_prompt'?'LLM prompt':esc((i.bucket||'')+(i.object_key?'/'+i.object_key:''));
  return `<tr><td class="mono mu" style="white-space:nowrap">${fmtT(i.timestamp)}</td><td>${esc(i.actor||(i.event_type=='detection'?'pii-analyzer':'system'))}</td><td><b>${ev[i.event_type]||esc(i.event_type)}</b></td><td><span class="mono">${where}</span><div class="mu" style="font-size:12px">${esc(i.summary)}</div></td><td><span class="pill ${r[0]}">${esc(r[1])}</span></td></tr>`}).join('')}</table></div>`}
function dbDonut(rows,cols){if(rows.length>cols.length){const k=cols.length-1;rows=[...rows.slice(0,k),['Other',rows.slice(k).reduce((a,b)=>a+b[1],0)]]}return donut(rows,cols)}
function dbTimeline(t){const v=t.map(x=>x.entities_detected),runs=t.reduce((a,x)=>a+x.detection_runs,0),fails=t.reduce((a,x)=>a+x.failed_runs,0);
 if(!runs)return dbMsg('No detection runs in the last '+t.length+' days. Upload an object to see activity here.');
 const lab=d=>new Date(d+'T00:00:00').toLocaleDateString([],{day:'2-digit',month:'short'});
 return (Math.max(...v)?line(v):dbMsg('Detection ran but found no PII entities in this period.'))+`<div class="row mu" style="font-size:12px"><span>${lab(t[0].date)}</span><span>${fmtN(v.reduce((a,b)=>a+b,0))} entities · ${fmtN(runs)} runs${fails?' · '+fmtN(fails)+' failed':''} · peak ${fmtN(Math.max(...v))}/day</span><span>${lab(t[t.length-1].date)}</span></div>`}
function dashView(){if(!D.at&&!D.loading)setTimeout(dbLoad);if(!D.timer)dbAuto();
 const S=D.r.summary&&D.r.summary.data,P=D.r['pii-types']&&D.r['pii-types'].data,T=D.r.detection&&D.r.detection.data,A=D.r.anonymization&&D.r.anonymization.data,ACT=D.r.activity&&D.r.activity.data,LP=D.r['llm-prompts']&&D.r['llm-prompts'].data;
 const errs=DB_EPS.filter(e=>D.r[e]&&D.r[e].err),first=!D.at;
 const k=(l,ok,v,d)=>kpi(l,first?'…':ok?v:'—',first?'Loading…':ok?d:'Unavailable');
 const pr=T&&T.protection,flag=pr?pr.protected_objects+pr.partially_protected_objects+pr.unprotected_objects:0;
 const status=`<span class="mu" style="font-size:12px">${D.loading?'Refreshing…':D.at?'Updated '+D.at.toLocaleTimeString([],{hour12:false}):''}</span>`;
 return head('Dashboard','Live privacy posture from stored objects, detected PII and policy enforcement',status+`<button class="btn" onclick="dbLoad()" ${D.loading?'disabled':''}>Refresh</button>`)+
 (errs.length?`<div class="tb bad" style="margin:0 0 24px"><b>Some dashboard data could not be loaded.</b> <span class="mu">${errs.map(e=>esc(e)+': '+esc(D.r[e].err)).join(' · ')}</span> <button class="btn g" style="margin-left:8px" onclick="dbLoad()">Retry</button></div>`:'')+
 (S&&S.total_objects==0?`<div class="tb" style="margin:0 0 24px"><b>No objects stored yet.</b> <span class="mu">Upload a text object as admin (PUT /&lt;bucket&gt;/&lt;key&gt;). It is analysed on upload and appears here.</span></div>`:'')+`
<div class="grid g4">${k('Total objects',S,S&&fmtN(S.total_objects),S&&`${fmtN(S.total_buckets)} bucket${S.total_buckets==1?'':'s'} · ${fmtB(S.total_size_bytes)}`)}${k('Objects scanned',S,S&&fmtN(S.scanned_objects),S&&(S.scan_coverage_pct==null?'No objects yet':`${S.scan_coverage_pct}% coverage · ${fmtN(S.unscanned_objects)} unscanned`))}${k('Objects with PII',P,P&&fmtN(P.objects_with_pii),P&&`across ${fmtN(P.total_entities)} entities`)}${k('Fully protected',pr,pr&&fmtN(pr.protected_objects),pr&&(flag?`${pct(pr.protected_pct)} of objects with PII`:'No objects with PII'))}</div>
<div class="card" style="border:0;padding:0;margin-top:34px"><h3>LLM Playground prompts <span>counted per prompt · separate from stored objects</span></h3></div>
<div class="grid g4">${k('LLM prompts',LP,LP&&fmtN(LP.prompts_total),LP&&`${fmtN(LP.prompts_sent)} sent · ${fmtN(LP.prompts_blocked)} blocked`)}${k('Prompts with PII',LP,LP&&fmtN(LP.prompts_with_pii),LP&&`${fmtN(LP.entities_detected)} entities detected`)}${k('Prompts protected',LP,LP&&fmtN(LP.prompts_protected),LP&&`${fmtN(LP.entities_protected)} entities masked by policy`)}${k('Sent unchanged',LP,LP&&fmtN(LP.prompts_unchanged),LP&&'no masking rule applied')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Prompt PII by type <span>${LP?fmtN(LP.entities_detected):''}</span></h3>${dbSec('llm-prompts',d=>d.by_entity_type.length?dbDonut(d.by_entity_type.map(t=>[nice(t.name),t.count]),COL):dbMsg(d.prompts_total?'No PII detected in LLM prompts.':'No LLM prompts yet. Send one from the LLM Playground.'))}</div>
<div class="card"><h3>Prompts · last ${LP?LP.window_days:14} days</h3>${dbSec('llm-prompts',d=>{const v=d.timeline.map(x=>x.prompts);if(!d.prompts_total)return dbMsg('No LLM prompts yet. Send one from the LLM Playground.');const lab=x=>new Date(x+'T00:00:00').toLocaleDateString([],{day:'2-digit',month:'short'});
 return (Math.max(...v)?line(v):dbMsg('No prompts in this period.'))+`<div class="row mu" style="font-size:12px"><span>${lab(d.timeline[0].date)}</span><span>${fmtN(v.reduce((a,b)=>a+b,0))} prompts · ${fmtN(d.timeline.reduce((a,x)=>a+x.with_pii,0))} with PII${d.prompts_blocked?' · '+fmtN(d.prompts_blocked)+' blocked':''}</span><span>${lab(d.timeline[d.timeline.length-1].date)}</span></div>`})}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>PII by type <span>${P?fmtN(P.total_entities):''}</span></h3>${dbSec('pii-types',d=>d.types.length?dbDonut(d.types.map(t=>[nice(t.entity_type),t.count]),COL)+`<div class="mu" style="font-size:12px;margin-top:8px">Avg confidence: ${d.types.slice(0,4).map(t=>nice(t.entity_type)+' '+Math.round(t.avg_score*100)+'%').join(' · ')}</div>`:dbMsg('No PII detected in stored objects yet.'))}</div>
<div class="card"><h3>Protection status</h3>${dbSec('detection',d=>{const p=d.protection;if(!flag)return dbMsg('No objects with PII yet, so there is nothing to protect.');
 return [['Protected',p.protected_objects,p.protected_pct,'var(--ac)'],['Partially protected',p.partially_protected_objects,p.partially_protected_pct,'var(--wa)'],['Unprotected',p.unprotected_objects,p.unprotected_pct,'var(--cr)']].map(r=>`<div style="margin:11px 0"><div class="row"><span>${r[0]}</span><b>${pct(r[2])} <span class="mu" style="font-weight:400">· ${fmtN(r[1])}</span></b></div>${bar(r[2]||0,r[3])}</div>`).join('')+
 `<div class="mu" style="font-size:12px">${p.assigned_policies.length?'Protected = every detected type has a rule in every assigned policy ('+p.assigned_policies.map(esc).join(', ')+').':'No policy is assigned to any user, so every object with PII is served unmodified.'}${p.uncovered_entity_types.length?' No rule for: '+p.uncovered_entity_types.map(u=>nice(u.entity_type)+' ('+fmtN(u.count)+')').join(', ')+'.':''}${p.users_without_policy?' '+fmtN(p.users_without_policy)+(p.users_without_policy==1?' user without a policy receives':' users without a policy receive')+' originals.':''}</div>`})}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Detections · last ${T?T.window_days:14} days</h3>${dbSec('detection',d=>dbTimeline(d.timeline)+(d.tracking_since?'':d.objects_scanned?dbMsg('<span style="font-size:12px">Objects analysed before activity tracking was added have no timestamps, so they are counted in the totals but not in this chart.</span>'):''))}</div>
<div class="card"><h3>Anonymization <span>${A?fmtN(A.requests_total)+' requests':''}</span></h3>${dbSec('anonymization',a=>{if(!a.requests_total&&!a.served_original)return dbMsg('No policy-protected reads yet. Stats appear when a user with a policy reads an object or uses the LLM Playground.');
 const src={object:'Object GETs',llm_prompt:'LLM prompts'};
 return `<div class="grid g3" style="gap:12px 20px;grid-template-columns:repeat(3,1fr)">${[['Entities anonymized',fmtN(a.entities_anonymized)],['Failed',fmtN(a.failed)],['Served original',fmtN(a.served_original)]].map(x=>`<div><div class="mu" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">${x[0]}</div><b style="font-size:20px">${x[1]}</b></div>`).join('')}</div>`+
 (a.by_operator.length?`<div style="margin-top:14px">${dbDonut(a.by_operator.map(o=>[nice(o.name),o.count]),['#1f4d3a','#b3261e','#8fae9c','#c9a24a','#5b6b7a'])}</div>`:'')+
 `<div class="mu" style="font-size:12px;margin-top:8px">${a.by_source.map(s=>(src[s.name]||esc(s.name))+': '+fmtN(s.count)).join(' · ')}${a.failed?' · failures returned the original object (existing behaviour) or blocked the prompt':''}</div>`})}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Objects by bucket</h3>${dbSec('summary',s=>s.buckets.length?s.buckets.map(b=>{const c=b.objects?Math.round(b.scanned/b.objects*100):0;return `<div style="margin:11px 0"><div class="row"><span class="mono">${esc(b.bucket)}</span><b>${fmtN(b.objects)} <span class="mu" style="font-weight:400">· ${c}% scanned · ${fmtN(b.with_pii)} with PII</span></b></div>${bar(c)}</div>`}).join('')+(s.orphaned_metadata_rows?`<div class="mu" style="font-size:12px">${fmtN(s.orphaned_metadata_rows)} PII record(s) for files no longer in storage are excluded.</div>`:''):dbMsg('No buckets yet.'))}</div>
<div class="card"><h3>Recent activity <span>${ACT?fmtN(ACT.total_events)+' events':''}</span></h3>${dbSec('activity',a=>a.items.length?actTbl(a.items):dbMsg('No activity recorded yet. Uploads, detections, policy-protected reads and deletes appear here.'))}</div></div>`}

/* ---------- Authentication: JWT kept in sessionStorage (cleared when the tab closes) ---------- */
const AUTH={token:null,user:null,role:null,exp:0};
try{const a=JSON.parse(sessionStorage.getItem('pii_auth')||'null');if(a&&a.token&&a.exp>Date.now())Object.assign(AUTH,a)}catch(e){}
function showLogin(msg){$('#login').hidden=false;$('#lerr').textContent=msg||'';$('#lu').focus()}
function logout(msg){AUTH.token=AUTH.user=AUTH.role=null;AUTH.exp=0;try{sessionStorage.removeItem('pii_auth')}catch(e){}L.msgs=[];L.sent=[];L.run=null;L.draft='';PE.loaded=0;PE.ed=null;PE.err=PE.ok='';D.r={};D.at=null;clearInterval(D.timer);D.timer=null;showLogin(msg)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+AUTH.token}});if(r.status==401)logout('Your session has expired. Please sign in again.');return r}
async function doLogin(ev){ev.preventDefault();const b=$('#lb');b.disabled=true;$('#lerr').textContent='';
 try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#lu').value.trim(),password:$('#lp').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#lerr').textContent=r.status==401?'Invalid username or password.':(typeof j.detail=='string'?j.detail:'Sign-in failed (HTTP '+r.status+').');return}
  Object.assign(AUTH,{token:j.access_token,user:j.user.username,role:j.user.role,exp:Date.now()+j.expires_in*1000});
  try{sessionStorage.setItem('pii_auth',JSON.stringify(AUTH))}catch(e){}
  $('#lp').value='';$('#login').hidden=true;go()}
 catch(e){$('#lerr').textContent='Cannot reach the server.'}finally{b.disabled=false}}
function nav(p){if(p=='policy')PE.loaded=0;if(p=='dash'&&D.at)setTimeout(dbLoad);location.hash=p}
function go(keep){if(!AUTH.token){showLogin();return}const ph=$('#q'),pos=ph?ph.selectionStart:0;$('#m').innerHTML=V[page]();$('#nav').innerHTML=PAGES.map((p,i)=>`<a class="${p[0]==page?'on':''}" onclick="nav('${p[0]}')"><span>${String(i+1).padStart(2,'0')}</span>${p[2]}</a>`).join('');if(keep){const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}else $('#m').scrollTop=0}
addEventListener('hashchange',()=>{page=location.hash.slice(1)||'dash';if(!V[page])page='dash';go()});
if(!V[page])page='dash';go();
</script></body></html>
