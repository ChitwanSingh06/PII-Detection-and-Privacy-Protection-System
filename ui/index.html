<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PII Guard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{--bg:#f4f2ee;--panel:#fbfaf7;--panel2:#ebe8e1;--line:#d8d4ca;--tx:#16181d;--mu:#77756d;--ac:#1f4d3a;--ac2:#7a9a88;--ok:#2f6b4f;--wa:#a37a12;--hi:#c2561b;--cr:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101211;--panel:#161918;--panel2:#1d211f;--line:#2b302d;--tx:#ecebe6;--mu:#8b8f89;--ac:#9fd8b8;--ac2:#4f7a65;--ok:#7cc4a0;--wa:#d9b24a;--hi:#e08a55;--cr:#e57a70}}
:root[data-theme="dark"]{--bg:#101211;--panel:#161918;--panel2:#1d211f;--line:#2b302d;--tx:#ecebe6;--mu:#8b8f89;--ac:#9fd8b8;--ac2:#4f7a65;--ok:#7cc4a0;--wa:#d9b24a;--hi:#e08a55;--cr:#e57a70}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13.5px/1.5 Inter,system-ui,sans-serif;display:flex;-webkit-font-smoothing:antialiased}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
aside{width:212px;border-right:1px solid var(--line);padding:26px 0 20px 26px;display:flex;flex-direction:column;overflow:auto;flex:none}
.logo{display:flex;gap:11px;align-items:center;margin-bottom:34px;font-family:Newsreader,Georgia,serif;font-size:21px;letter-spacing:-.01em}
.logo i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tx);background:radial-gradient(circle,var(--ac) 0 3.5px,transparent 4px)}
.logo small{display:block;font:500 9.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:1px}
nav a{display:flex;gap:12px;padding:7px 0;color:var(--mu);cursor:pointer;border-right:2px solid transparent;margin-right:-1px}
nav a span{font:400 10.5px "JetBrains Mono",monospace;padding-top:3px;opacity:.7}
nav a:hover{color:var(--tx)}nav a.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{flex:1;min-width:0;overflow:auto;padding:30px 44px 60px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:34px;padding-bottom:18px;border-bottom:1px solid var(--tx)}
h1{font:400 34px/1.1 Newsreader,Georgia,serif;margin:0;letter-spacing:-.02em}.sub{color:var(--mu);margin-top:6px}
.btn{background:var(--tx);color:var(--bg);border:1px solid var(--tx);border-radius:2px;padding:7px 14px;cursor:pointer;font:500 12.5px Inter,sans-serif}
.btn.g{background:transparent;color:var(--tx);border-color:var(--line)}.btn.g:hover{border-color:var(--tx)}
.grid{display:grid;gap:36px 40px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:none;border:0;border-top:1px solid var(--line);padding:14px 0 0;min-width:0}
.card h3{margin:0 0 16px;font:600 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.kpi{border-top-color:var(--tx)}.kpi .l{color:var(--mu);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.kpi .v{font:400 44px/1.1 Newsreader,Georgia,serif;letter-spacing:-.03em;margin:8px 0 4px}.kpi .d{font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;color:var(--mu);font:500 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px 10px 0;border-bottom:1px solid var(--line)}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel2)}tr:last-child td{border:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c,var(--tx));background:none}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--tx))}
.Critical{--c:var(--cr)}.High{--c:var(--hi)}.Medium{--c:var(--wa)}.Low,.Protected,.Healthy,.Active,.Completed{--c:var(--ok)}.Pending,.Scanning,.Degraded,.Partial{--c:var(--wa)}.Inactive,.Unscanned{--c:var(--mu)}.Unprotected{--c:var(--cr)}
.bar{height:2px;background:var(--line);margin-top:6px}.bar b{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.mu{color:var(--mu)}.mono{font:400 12px "JetBrains Mono",monospace}
input,select{background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 2px;font:inherit;outline:0}input:focus,select:focus{border-color:var(--tx)}
.chips{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line)}.chip{padding:0 0 9px;color:var(--mu);cursor:pointer;margin-bottom:-1px;border-bottom:2px solid transparent}.chip:hover{color:var(--tx)}.chip.on{color:var(--tx);border-color:var(--ac);font-weight:600}
.pre{background:var(--panel2);padding:18px;white-space:pre-wrap;word-break:break-word;line-height:2;border-radius:2px}
mark{background:none;color:var(--cr);border-bottom:1.5px solid var(--cr);padding:0}mark.m{color:var(--ok);border-color:var(--ok)}
.sw{width:30px;height:16px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0}.sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--bg);transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:16px}
.flow{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}.flow>div{flex:1;min-width:170px}.flow .ar{flex:none;min-width:0;align-self:center;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.logo{display:none}nav{display:flex;gap:16px}nav a{white-space:nowrap;border:0}main{padding:20px 18px}h1{font-size:26px}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--tx)}
.step{padding:12px 12px 4px 0;opacity:.45}.step.on,.step.done{opacity:1}.step b{display:block;font-weight:600}.step small{color:var(--mu)}.step.out{border-left:1px dashed var(--cr);padding-left:14px}
.zone{display:flex;gap:0;font:600 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}.zone span:first-child{flex:4}.zone span:last-child{flex:2;color:var(--cr);padding-left:14px}
.tb{padding:12px 14px;border-left:2px solid var(--ok);background:var(--panel2);margin:18px 0 0}.tb.bad{border-color:var(--cr)}
.chat{height:340px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.msg{margin:12px 0;max-width:92%}.msg.u{margin-left:auto;background:var(--panel2);padding:10px 14px;border-radius:2px}.msg small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
textarea{width:100%;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:2px;padding:12px;font:inherit;resize:none;outline:0;margin-top:12px}textarea:focus{border-color:var(--tx)}
#login{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#login[hidden]{display:none}
#login form{width:340px;max-width:100%}#login h1{font-size:30px;margin-bottom:6px}#login .sub{margin-bottom:28px}
#login label{display:block;font:500 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}#login input{width:100%;margin:4px 0 20px}
#login .err{color:var(--cr);min-height:20px;margin-bottom:10px}#login .btn{width:100%;padding:10px 14px}#login .btn:disabled{opacity:.6;cursor:default}
</style></head><body>
<div id="login" hidden><form onsubmit="doLogin(event)" autocomplete="on"><h1>PII Guard</h1><div class="sub">Sign in to continue. Demo accounts are listed in the README.</div>
<label for="lu">Username</label><input id="lu" name="username" autocomplete="username" required maxlength="64">
<label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required maxlength="128">
<div class="err" id="lerr" role="alert"></div><button class="btn" id="lb" type="submit">Sign in</button></form></div>
<aside><div class="logo"><i></i><div>PII Guard<small>Privacy Protection</small></div></div><nav id="nav"></nav></aside>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s);
const PAGES=[['dash','◉','Dashboard'],['detect','⌕','PII Detection'],['policy','⚙','Policy Engine'],['anon','⇄','Anonymization'],['ana','◔','Analytics'],['audit','☰','Audit Logs'],['llm','✦','LLM Playground']];
const COL=['#1f4d3a','#4f7a65','#8fae9c','#c9a24a','#b3261e','#5b6b7a','#a9a597','#33383a'];
let page=location.hash.slice(1)||'dash',sel=0,bk='All',q='',lf='All';
const pill=t=>`<span class="pill ${t.split(' ')[0]}">${t}</span>`;
const bar=(p,c)=>`<div class="bar"><b style="width:${p}%;${c?'background:'+c:''}"></b></div>`;
const kpi=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
function donut(data,cols){const t=data.reduce((a,b)=>a+b[1],0);let o=25,s='';data.forEach((d,i)=>{const p=d[1]/t*100;s+=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${cols[i]}" stroke-width="4" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"/>`;o-=p});
return `<div class="row" style="gap:18px;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="150">${s}</svg><div style="flex:1;min-width:140px">${data.map((d,i)=>`<div class="row" style="margin:5px 0"><span><span class="dot" style="--c:${cols[i]}"></span> ${d[0]}</span><b>${d[1].toLocaleString()}</b></div>`).join('')}</div></div>`}
function line(a,b,c){const w=420,h=150,mx=Math.max(...a,...(b||[]))*1.1;const pt=v=>v.map((y,i)=>`${i*w/(v.length-1)},${h-y/mx*h}`).join(' ');
return `<svg viewBox="0 0 ${w} ${h+4}" width="100%" preserveAspectRatio="none" style="height:170px"><polyline points="0,${h} ${pt(a)} ${w},${h}" fill="${c||'var(--ac)'}" opacity=".08"/><polyline points="${pt(a)}" fill="none" stroke="${c||'var(--ac)'}" stroke-width="1.5"/>${b?`<polyline points="${pt(b)}" fill="none" stroke="var(--cr)" stroke-width="1.5"/>`:''}</svg>`}
function hbars(rows){return rows.map(r=>`<div style="margin:11px 0"><div class="row"><span>${r[0]}</span><b>${r[1]}${r[2]||''}</b></div>${bar(r[3]??r[1])}</div>`).join('')}
const head=(t,s,x='')=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="row">${x}<span class="mu">${esc(AUTH.user||'')} · ${esc(AUTH.role||'')}</span><button class="btn g" onclick="tg()">Theme</button><button class="btn g" onclick="logout()">Sign out</button></div></div>`;
function tg(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#101211';r.dataset.theme=d?'light':'dark'}
const V={
dash(){return dashView()}};
/* ---------- Live data store for the other data pages (nothing hardcoded: every number comes from the API) ---------- */
const X={},AU={f:'',q:'',off:0,limit:25},TZ=()=>-new Date().getTimezoneOffset();
const ADMIN_PAGES=new Set(['detect','ana','audit']),canSee=p=>!ADMIN_PAGES.has(p)||AUTH.role=='admin';
const U={detect:()=>'/api/admin/pii-detection?limit=20',ana:()=>'/api/admin/analytics?days=14&tz_offset_minutes='+TZ(),
 audit:()=>'/api/admin/audit-logs?limit='+AU.limit+'&offset='+AU.off+(AU.f?'&event_type='+encodeURIComponent(AU.f):'')+(AU.q?'&q='+encodeURIComponent(AU.q):''),
 anon:()=>'/api/dashboard/anonymization?days=14&tz_offset_minutes='+TZ(),anact:()=>'/api/dashboard/activity?limit=100',pol:()=>'/api/policies'};
const PAGE_DATA={detect:['detect'],ana:['ana'],audit:['audit'],anon:['anon','anact','pol']};
async function xLoad(key){const s=X[key]||(X[key]={});if(s.loading)return;if(key=='pol'&&AUTH.role!='admin')return;s.loading=1;
 try{const r=await api(U[key]());if(r.status==401){s.loading=0;return}
  if(r.status==403){s.err='Administrator access is required.';s.data=null}
  else if(!r.ok){s.err=await errMsg(r)}
  else{const j=await r.json();s.data=key=='pol'?{items:j}:j.data;s.at=new Date();s.err=''}}
 catch(e){s.err='Cannot reach the server ('+e.message+')'}
 s.loading=0;if(AUTH.token&&PAGE_DATA[page]&&PAGE_DATA[page].includes(key))xPaint()}
function xPaint(){const a=document.activeElement,m=$('#m');if(a&&m&&m.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return; // never repaint under a field being edited
 const st=m?m.scrollTop:0;go(1);if(m)m.scrollTop=st}
function refreshPage(){(PAGE_DATA[page]||[]).forEach(k=>xLoad(k))}
function tick(force){if(!AUTH.token||(document.hidden&&!force))return;if(page=='dash')dbLoad();else refreshPage()}
function refreshAll(){tick(true)} // called after operations (policy change, prompt sent, ...)
function enter(){if(PAGE_DATA[page])refreshPage()}
const xs=keys=>{const e=keys.map(k=>X[k]).find(s=>s&&s.err&&!s.data);if(e)return`<div class="tb bad"><b>Could not load data.</b> <span class="mu">${esc(e.err)}</span> <button class="btn g" style="margin-left:8px" onclick="refreshPage()">Retry</button></div>`;
 if(keys.some(k=>!(X[k]&&X[k].at)&&!(k=='pol'&&AUTH.role!='admin')))return dbMsg('Loading…');return''};
const stamp=keys=>{const t=keys.map(k=>X[k]&&X[k].at).filter(Boolean).sort().pop(),l=keys.some(k=>X[k]&&X[k].loading);return`<span class="mu" style="font-size:12px">${l?'Refreshing…':t?'Updated '+t.toLocaleTimeString([],{hour12:false})+' · auto-refresh 15s':''}</span>`};
const refBtn=`<button class="btn g" onclick="refreshPage()">Refresh</button>`;
const denied=t=>head(t,'Administrators only')+`<div class="card"><div class="mu">Only administrators can view this page.</div></div>`;
const pc=v=>v==null?'—':Math.round(v*100)+'%';
const dayLab=d=>new Date(d+'T00:00:00').toLocaleDateString([],{day:'2-digit',month:'short'});

/* ---------- PII Detection (admin) ---------- */
V.detect=()=>{if(!canSee('detect'))return denied('PII Detection');const hd=head('PII Detection','Supported categories with live counts from LLM prompts and stored objects',stamp(['detect'])+refBtn),w=xs(['detect']);if(w)return hd+w;const d=X.detect.data;
 const ps=d.prompt_scans||{runs:0,with_pii:0,entities:0};
 const kp=`<div class="grid g4">${kpi('Prompts scanned',fmtN(ps.runs),'LLM Playground prompts')}${kpi('Prompts with PII',fmtN(ps.with_pii),'at least one entity')}${kpi('Entities detected',fmtN(ps.entities+d.total_entities),fmtN(ps.entities)+' in prompts · '+fmtN(d.total_entities)+' in stored objects')}${kpi('Detection runs',fmtN(ps.runs+d.detection_runs_total),fmtN(d.detection_failures_total)+' failed · '+fmtN(d.detection_runs_total)+' object scans')}</div>`;
 const cats=d.categories.map((c,i)=>`<div class="card"><div class="row"><b>${esc(c.label)}</b><span class="dot" style="--c:${COL[i%COL.length]}"></span></div><div class="mono mu" style="font-size:11px">${esc(c.entity_type)} · ${esc(c.region)}</div><div class="v" style="font-size:24px;font-weight:700;margin:6px 0">${fmtN(c.count+(c.prompt_count||0))}</div><div class="row mu" style="font-size:12px"><span>${fmtN(c.prompt_count||0)} in prompts · ${fmtN(c.objects)} object${c.objects==1?'':'s'}</span><span>Avg confidence <b style="color:var(--tx)">${pc(c.avg_score)}</b></span></div>${bar(c.avg_score==null?0:Math.round(c.avg_score*100),COL[i%COL.length])}<div class="mu" style="font-size:11px;margin-top:6px">${esc(c.detector)}</div></div>`).join('');
 const oth=d.other_types.length?`<div class="card" style="margin-top:16px"><h3>Other detected types <span>${d.other_types.length}</span></h3><div class="tw"><table><tr><th>Type</th><th>Entities</th><th>Objects</th><th>Avg confidence</th></tr>${d.other_types.map(t=>`<tr><td><b>${nice(t.entity_type)}</b></td><td>${fmtN(t.count)}</td><td>${fmtN(t.objects)}</td><td>${pc(t.avg_score)}</td></tr>`).join('')}</table></div></div>`:'';
 const rows=d.latest_results.map(r=>{const sc=r.entities.map(e=>e.score),avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null,det=[...new Set(r.entities.map(e=>e.detector))].join(', ');
  const types=Object.entries(r.by_entity_type||{}).map(([t,n])=>`<span class="pill Active">${nice(t)} × ${fmtN(n)}</span>`).join(' ');
  return`<tr><td class="mono mu" style="white-space:nowrap">${fmtT(r.timestamp)}</td><td><span class="mono">${esc(r.bucket+'/'+r.object_key)}</span>${r.object_exists?'':'<div class="mu" style="font-size:12px">object since deleted</div>'}</td><td>${r.status!='ok'?'<span class="pill Unprotected">Analysis failed</span>':types||'<span class="mu">No PII detected</span>'}</td><td style="width:150px">${avg==null?'<span class="mu">—</span>':`<div class="row"><b>${pc(avg)}</b></div>${bar(Math.round(avg*100))}`}</td><td class="mu">${esc(det||'—')}</td></tr>`}).join('');
 return hd+kp+`<div class="grid g4" style="margin-top:34px">${cats}</div>${oth}<div class="card" style="margin-top:16px"><h3>Latest LLM prompt scans <span>types and counts only</span></h3>${(d.latest_prompts||[]).length?`<div class="tw"><table><tr><th>Time</th><th>User</th><th>PII identified</th></tr>${d.latest_prompts.map(p=>`<tr><td class="mono mu" style="white-space:nowrap">${fmtT(p.timestamp)}</td><td>${esc(p.user||'—')}</td><td>${Object.entries(p.by_entity_type||{}).map(([t,n])=>`<span class="pill Active">${nice(t)} × ${fmtN(n)}</span>`).join(' ')||'<span class="mu">No PII detected</span>'}</td></tr>`).join('')}</table></div>`:dbMsg('No prompts scanned yet. Send one from the LLM Playground; the PII found in it appears here.')}</div><div class="card" style="margin-top:16px"><h3>Latest detection results <span>matched text is never shown</span></h3>${rows?`<div class="tw"><table><tr><th>Time</th><th>Object</th><th>Entities</th><th>Confidence</th><th>Detector</th></tr>${rows}</table></div>`:dbMsg('No detection runs yet. Upload a text object as admin (PUT /&lt;bucket&gt;/&lt;key&gt;); it is analysed on upload and appears here.')}</div>`};

/* ---------- Anonymization (all roles; policy rules are visible to admins only) ---------- */
V.anon=()=>{const hd=head('Anonymization','Applied policies, operators and outcomes from real GET and prompt events',stamp(['anon','anact'])+refBtn),w=xs(['anon','anact']);if(w)return hd+w;
 const a=X.anon.data,evs=(X.anact.data.items||[]).filter(i=>i.event_type=='anonymization'||i.event_type=='download').slice(0,10);
 const kp=`<div class="grid g4">${kpi('Requests anonymized',fmtN(a.anonymized_ok),fmtN(a.requests_total)+' policy-protected requests')}${kpi('Entities anonymized',fmtN(a.entities_anonymized),'masked, replaced, hashed or redacted')}${kpi('Failures',fmtN(a.failed),'original returned / prompt blocked')}${kpi('Served original',fmtN(a.served_original),'no policy rule applied')}</div>`;
 const tl=a.timeline,v=tl.map(x=>x.anonymized);
 const rules=AUTH.role=='admin'?`<div class="card" style="margin-top:16px"><h3>Active policy rules <span>from the Policy Engine</span></h3>${X.pol&&X.pol.data?`<div class="tw"><table><tr><th>Policy</th><th>PII type</th><th>Operator</th><th>Parameters</th><th>Assigned to</th></tr>${X.pol.data.items.flatMap(p=>p.rules.map(r=>`<tr><td><b>${esc(p.policy_name)}</b></td><td class="mono">${esc(r.entity_type)}</td><td>${pill('Active').replace('Active',esc(r.operator_name))}</td><td class="mono mu">${esc(Object.entries(r.operator_params||{}).map(([k,x])=>k+'='+x).join(', ')||'(none)')}</td><td>${p.assigned_users.length?p.assigned_users.map(esc).join(', '):'<span class="mu">nobody</span>'}</td></tr>`)).join('')||'<tr><td colspan="5" class="mu">No policies defined.</td></tr>'}</table></div>`:dbMsg('Loading…')}</div>`:'';
 return hd+kp+`<div class="grid g2" style="margin-top:34px"><div class="card"><h3>By operator <span>${fmtN(a.by_operator.reduce((x,y)=>x+y.count,0))}</span></h3>${a.by_operator.length?dbDonut(a.by_operator.map(o=>[nice(o.name),o.count]),['#1f4d3a','#b3261e','#8fae9c','#c9a24a','#5b6b7a']):dbMsg('No anonymization has happened yet. It starts when a user with a policy reads an object or sends an LLM prompt.')}</div>
<div class="card"><h3>By PII type <span>${fmtN(a.entities_anonymized)}</span></h3>${a.by_entity_type.length?dbDonut(a.by_entity_type.map(o=>[nice(o.name),o.count]),COL):dbMsg('Nothing anonymized yet.')}</div></div>

<div class="row" style="justify-content:flex-start;margin-bottom:14px"><span class="mu">Name</span><input placeholder="e.g. analyst_policy" maxlength="64" style="width:260px" value="${qa(e.name)}" ${e.isNew?'':'disabled'} oninput="PE.ed.name=this.value"></div>
<div class="tw"><table><tr><th>PII type</th><th>Action</th><th>Parameters</th><th></th></tr>${e.rules.map((r,i)=>`<tr><td><input list="ents" style="width:190px" value="${qa(r.entity_type)}" oninput="peSetEnt(${i},this.value)"></td><td><select onchange="peSetOp(${i},this.value)">${OPS.map(o=>`<option ${o==r.operator_name?'selected':''}>${o}</option>`).join('')}</select></td><td>${peParams(r,i)}</td><td><button class="btn g" onclick="peDelRule(${i})" title="Remove rule">✕</button></td></tr>`).join('')}</table></div>
<datalist id="ents">${ENT.map(x=>`<option value="${x}">`).join('')}</datalist>
<div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn g" onclick="peAddRule()">+ Add rule</button><button class="btn" onclick="peSave()">Save</button><button class="btn g" onclick="peCancel()">Cancel</button></div></div>`:'';
 const rows=PE.policies.map((p,i)=>`<tr><td><b>${esc(p.policy_name)}</b></td><td class="mono">${p.rules.map(x=>esc(x.entity_type)+' <span class="mu">'+esc(x.operator_name)+'</span>').join('<br>')}</td><td>${p.assigned_users.length?p.assigned_users.map(esc).join(', '):'<span class="mu">nobody</span>'}</td><td style="white-space:nowrap"><button class="btn g" onclick="peEdit(${i})">Edit</button> <button class="btn g" onclick="peDelete(${i})">Delete</button></td></tr>`).join('');
 const urows=PE.users.map((u,i)=>`<tr><td><b>${esc(u.user_name)}</b></td><td class="mu">${esc(u.role)}</td><td><select onchange="peAssign(${i},this.value)"><option value="" ${u.policy_name?'':'selected'}>(no policy: original file)</option>${PE.policies.map(p=>`<option ${p.policy_name==u.policy_name?'selected':''}>${esc(p.policy_name)}</option>`).join('')}</select></td></tr>`).join('');
 return hd+msg+`<div class="card" style="margin-top:24px"><h3>Policies <span>${PE.policies.length}</span></h3>${PE.loading&&!PE.loaded?'<div class="mu">Loading…</div>':`<div class="tw"><table><tr><th>Name</th><th>Rules</th><th>Assigned to</th><th></th></tr>${rows||'<tr><td colspan="4" class="mu">No policies yet.</td></tr>'}</table></div>`}</div>${editor}
<div class="card" style="margin-top:24px"><h3>User assignments</h3><div class="tw"><table><tr><th>User</th><th>Role</th><th>Policy</th></tr>${urows||'<tr><td colspan="3" class="mu">No users.</td></tr>'}</table></div></div>
<div class="grid g4" style="margin-top:24px">${[['mask','Hide N characters, keep the rest'],['redact','Remove the text entirely'],['replace','Substitute a fixed value'],['hash','SHA-256 / SHA-512 digest']].map(a=>`<div class="card"><b>${a[0]}</b><div class="mu" style="margin-top:4px">${a[1]}</div></div>`).join('')}</div>`};

/* ---------- Live Dashboard: /api/dashboard/* (real SQLite + storage metrics; nothing hardcoded) ---------- */
const DB_EPS=['summary','pii-types','detection','anonymization','llm-prompts','activity'];
const D={r:{},loading:0,at:null,timer:null};
const fmtN=n=>Number(n||0).toLocaleString(),pct=v=>v==null?'—':v+'%';
const fmtB=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const fmtT=iso=>{const d=new Date(iso),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});return d.toDateString()==new Date().toDateString()?t:d.toLocaleDateString([],{day:'2-digit',month:'short'})+' '+t};
const nice=t=>esc(String(t).replace(/_/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\b(Ip|Us|Uk|Ssn|Url|Iban|Nrp|Nhs|Itin|Pan|Gst|Upi)\b/g,w=>w.toUpperCase()));
async function dbLoad(){if(D.loading)return;D.loading=1;if(page=='dash')dbPaint();
 const tz=-new Date().getTimezoneOffset(),q={summary:'',detection:'?tz_offset_minutes='+tz,anonymization:'?tz_offset_minutes='+tz,'llm-prompts':'?tz_offset_minutes='+tz,activity:'?limit=8','pii-types':''};
 const res=await Promise.all(DB_EPS.map(async ep=>{try{const r=await api('/api/dashboard/'+ep+q[ep]);if(r.status==401)return null;
  if(!r.ok)return{err:await errMsg(r)};const j=await r.json();return{data:j.data,at:j.generated_at}}catch(e){return{err:'Cannot reach the server ('+e.message+')'}}}));
 D.loading=0;if(!AUTH.token)return;DB_EPS.forEach((ep,i)=>{if(res[i])D.r[ep]=res[i]});D.at=new Date();if(page=='dash')dbPaint()}
function dbPaint(){const m=$('#m'),st=m?m.scrollTop:0;go();if(m)m.scrollTop=st}
function dbAuto(){if(D.timer)return;D.timer=setInterval(()=>tick(),15000)} // one 15s refresh for whichever data page is open
const dbMsg=(t,cls='mu')=>`<div class="${cls}" style="padding:10px 0">${t}</div>`;
function dbSec(ep,fn){const x=D.r[ep];if(!x)return dbMsg('Loading…');if(x.err)return dbMsg('Unavailable: '+esc(x.err),'mu');return fn(x.data)}
function actTbl(items){const ev=EV_LABEL;
 const res={ok:['Completed','OK'],failed:['Unprotected','Failed'],original:['Pending','Original']};
 return `<div class="tw"><table><tr><th>Time</th><th>User</th><th>Event</th><th>Detail</th><th>Result</th></tr>${items.map(i=>{const r=res[i.status]||['Inactive',i.status];
  const where=i.source=='llm_prompt'?'LLM prompt':esc((i.bucket||'')+(i.object_key?'/'+i.object_key:''))||(i.event_type=='login'?'authentication':i.event_type=='policy_change'?'policy engine':'—');
  return `<tr><td class="mono mu" style="white-space:nowrap">${fmtT(i.timestamp)}</td><td>${esc(i.actor||(i.event_type=='detection'?'pii-analyzer':'system'))}</td><td><b>${ev[i.event_type]||esc(i.event_type)}</b></td><td><span class="mono">${where}</span><div class="mu" style="font-size:12px">${esc(i.summary)}</div></td><td><span class="pill ${r[0]}">${esc(r[1])}</span></td></tr>`}).join('')}</table></div>`}
function dbDonut(rows,cols){if(rows.length>cols.length){const k=cols.length-1;rows=[...rows.slice(0,k),['Other',rows.slice(k).reduce((a,b)=>a+b[1],0)]]}return donut(rows,cols)}
function dbTimeline(t){const v=t.map(x=>x.entities_detected),runs=t.reduce((a,x)=>a+x.detection_runs,0),fails=t.reduce((a,x)=>a+x.failed_runs,0);
 if(!runs)return dbMsg('No detection runs in the last '+t.length+' days. Upload an object to see activity here.');
 const lab=d=>new Date(d+'T00:00:00').toLocaleDateString([],{day:'2-digit',month:'short'});
 return (Math.max(...v)?line(v):dbMsg('Detection ran but found no PII entities in this period.'))+`<div class="row mu" style="font-size:12px"><span>${lab(t[0].date)}</span><span>${fmtN(v.reduce((a,b)=>a+b,0))} entities · ${fmtN(runs)} runs${fails?' · '+fmtN(fails)+' failed':''} · peak ${fmtN(Math.max(...v))}/day</span><span>${lab(t[t.length-1].date)}</span></div>`}
function dashView(){if(!D.at&&!D.loading)setTimeout(dbLoad);if(!D.timer)dbAuto();
 const S=D.r.summary&&D.r.summary.data,P=D.r['pii-types']&&D.r['pii-types'].data,T=D.r.detection&&D.r.detection.data,A=D.r.anonymization&&D.r.anonymization.data,ACT=D.r.activity&&D.r.activity.data,LP=D.r['llm-prompts']&&D.r['llm-prompts'].data;
 const errs=DB_EPS.filter(e=>D.r[e]&&D.r[e].err),first=!D.at;
 const k=(l,ok,v,d)=>kpi(l,first?'…':ok?v:'—',first?'Loading…':ok?d:'Unavailable');
 const pr=T&&T.protection,flag=pr?pr.protected_objects+pr.partially_protected_objects+pr.unprotected_objects:0;
 const status=`<span class="mu" style="font-size:12px">${D.loading?'Refreshing…':D.at?'Updated '+D.at.toLocaleTimeString([],{hour12:false}):''}</span>`;
 return head('Dashboard','Live privacy posture from LLM Playground prompts: detected PII and policy enforcement',status+`<button class="btn" onclick="dbLoad()" ${D.loading?'disabled':''}>Refresh</button>`)+
 (errs.length?`<div class="tb bad" style="margin:0 0 24px"><b>Some dashboard data could not be loaded.</b> <span class="mu">${errs.map(e=>esc(e)+': '+esc(D.r[e].err)).join(' · ')}</span> <button class="btn g" style="margin-left:8px" onclick="dbLoad()">Retry</button></div>`:'')+
 `
<div class="card" style="border:0;padding:0"><h3>LLM Playground prompts <span>counted per prompt</span></h3></div>
<div class="grid g4">${k('LLM prompts',LP,LP&&fmtN(LP.prompts_total),LP&&`${fmtN(LP.prompts_sent)} sent · ${fmtN(LP.prompts_blocked)} blocked`)}${k('Prompts with PII',LP,LP&&fmtN(LP.prompts_with_pii),LP&&`${fmtN(LP.entities_detected)} entities detected`)}${k('Prompts protected',LP,LP&&fmtN(LP.prompts_protected),LP&&`${fmtN(LP.entities_protected)} entities masked by policy`)}${k('Sent unchanged',LP,LP&&fmtN(LP.prompts_unchanged),LP&&'no masking rule applied')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Prompt PII by type <span>${LP?fmtN(LP.entities_detected):''}</span></h3>${dbSec('llm-prompts',d=>d.by_entity_type.length?dbDonut(d.by_entity_type.map(t=>[nice(t.name),t.count]),COL):dbMsg(d.prompts_total?'No PII detected in LLM prompts.':'No LLM prompts yet. Send one from the LLM Playground.'))}</div>
<div class="card"><h3>Prompts · last ${LP?LP.window_days:14} days</h3>${dbSec('llm-prompts',d=>{const v=d.timeline.map(x=>x.prompts);if(!d.prompts_total)return dbMsg('No LLM prompts yet. Send one from the LLM Playground.');const lab=x=>new Date(x+'T00:00:00').toLocaleDateString([],{day:'2-digit',month:'short'});
 return (Math.max(...v)?line(v):dbMsg('No prompts in this period.'))+`<div class="row mu" style="font-size:12px"><span>${lab(d.timeline[0].date)}</span><span>${fmtN(v.reduce((a,b)=>a+b,0))} prompts · ${fmtN(d.timeline.reduce((a,x)=>a+x.with_pii,0))} with PII${d.prompts_blocked?' · '+fmtN(d.prompts_blocked)+' blocked':''}</span><span>${lab(d.timeline[d.timeline.length-1].date)}</span></div>`})}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Anonymization <span>${A?fmtN(A.requests_total)+' requests':''}</span></h3>${dbSec('anonymization',a=>{if(!a.requests_total&&!a.served_original)return dbMsg('No policy-protected reads yet. Stats appear when a user with a policy reads an object or uses the LLM Playground.');
 const src={object:'Object GETs',llm_prompt:'LLM prompts'};
 return `<div class="grid g3" style="gap:12px 20px;grid-template-columns:repeat(3,1fr)">${[['Entities anonymized',fmtN(a.entities_anonymized)],['Failed',fmtN(a.failed)],['Served original',fmtN(a.served_original)]].map(x=>`<div><div class="mu" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">${x[0]}</div><b style="font-size:20px">${x[1]}</b></div>`).join('')}</div>`+
 (a.by_operator.length?`<div style="margin-top:14px">${dbDonut(a.by_operator.map(o=>[nice(o.name),o.count]),['#1f4d3a','#b3261e','#8fae9c','#c9a24a','#5b6b7a'])}</div>`:'')+
 `<div class="mu" style="font-size:12px;margin-top:8px">${a.by_source.map(s=>(src[s.name]||esc(s.name))+': '+fmtN(s.count)).join(' · ')}${a.failed?' · failures returned the original object (existing behaviour) or blocked the prompt':''}</div>`})}</div>
<div class="card"><h3>Recent activity <span>${ACT?fmtN(ACT.total_events)+' events':''}</span></h3>${dbSec('activity',a=>a.items.length?actTbl(a.items):dbMsg('No activity recorded yet. Uploads, detections, policy-protected reads and deletes appear here.'))}</div></div>`}

/* ---------- Authentication: JWT kept in sessionStorage (cleared when the tab closes) ---------- */
const AUTH={token:null,user:null,role:null,exp:0};
try{const a=JSON.parse(sessionStorage.getItem('pii_auth')||'null');if(a&&a.token&&a.exp>Date.now())Object.assign(AUTH,a)}catch(e){}
function showLogin(msg){$('#login').hidden=false;$('#lerr').textContent=msg||'';$('#lu').focus()}
function logout(msg){AUTH.token=AUTH.user=AUTH.role=null;AUTH.exp=0;try{sessionStorage.removeItem('pii_auth')}catch(e){}L.msgs=[];L.sent=[];L.run=null;L.draft='';PE.loaded=0;PE.ed=null;PE.err=PE.ok='';D.r={};D.at=null;Object.keys(X).forEach(k=>delete X[k]);Object.assign(AU,{f:'',q:'',off:0});clearInterval(D.timer);D.timer=null;showLogin(msg)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+AUTH.token}});if(r.status==401)logout('Your session has expired. Please sign in again.');return r}
async function doLogin(ev){ev.preventDefault();const b=$('#lb');b.disabled=true;$('#lerr').textContent='';
 try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#lu').value.trim(),password:$('#lp').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#lerr').textContent=r.status==401?'Invalid username or password.':(typeof j.detail=='string'?j.detail:'Sign-in failed (HTTP '+r.status+').');return}
  Object.assign(AUTH,{token:j.access_token,user:j.user.username,role:j.user.role,exp:Date.now()+j.expires_in*1000});
  try{sessionStorage.setItem('pii_auth',JSON.stringify(AUTH))}catch(e){}
  $('#lp').value='';$('#login').hidden=true;dbAuto();go();enter()}
 catch(e){$('#lerr').textContent='Cannot reach the server.'}finally{b.disabled=false}}
function nav(p){if(p=='policy')PE.loaded=0;if(p=='dash'&&D.at)setTimeout(dbLoad);location.hash=p}
function go(){if(!AUTH.token){showLogin();return}if(!V[page]||!canSee(page))page='dash';
 $('#m').innerHTML=V[page]();$('#nav').innerHTML=PAGES.filter(p=>canSee(p[0])).map((p,i)=>`<a class="${p[0]==page?'on':''}" onclick="nav('${p[0]}')"><span>${String(i+1).padStart(2,'0')}</span>${p[2]}</a>`).join('')}
addEventListener('hashchange',()=>{page=location.hash.slice(1)||'dash';if(!V[page]||!canSee(page)){page='dash';location.hash='dash'}go();$('#m').scrollTop=0;enter()});
if(!V[page]||!canSee(page))page='dash';go();if(AUTH.token){dbAuto();enter()}
</script></body></html>
